[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "land-record-platform-backend"
version = "0.1.0"
description = "FastAPI integration boundary for the Intelligent Land Record Platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "boto3>=1.35,<2.0",
  "celery>=5.4,<6.0",
  "fastapi>=0.115,<1.0",
  "argon2-cffi>=23.1,<26.0",
  "PyJWT>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "redis>=5.2,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
