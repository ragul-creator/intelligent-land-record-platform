name: Verify platform
on:
  pull_request:
  push:
    branches: [main, deploy/vercel-sih]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[dev]'
      - run: python -m pytest backend/tests ai/document_ai/tests ai/validation/tests -q
      - name: Verify migration SQL
        working-directory: backend
        run: alembic upgrade head --sql > /tmp/platform-migrations.sql
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test --maxWorkers=2
      - run: pnpm build
